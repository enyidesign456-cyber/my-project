<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypto 涨幅 Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #14181f; --muted: #6b7280; --line: #e5e7eb;
    --up: #0f9d58; --down: #d93025; --accent: #2563eb;
    --up-bg: rgba(15,157,88,.14); --down-bg: rgba(217,48,37,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --card: #161b22; --text: #e6e9ee; --muted: #8b95a5; --line: #262d37;
      --up: #3ddc84; --down: #ff6b6b; --accent: #5b9dff;
      --up-bg: rgba(61,220,132,.16); --down-bg: rgba(255,107,107,.16);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  input, button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 12px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .banner { background: var(--down-bg); color: var(--down); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; display: none; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .card .name { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .card img { width: 24px; height: 24px; border-radius: 50%; }
  .card .price { font-size: 22px; font-weight: 700; margin: 6px 0 8px; font-variant-numeric: tabular-nums; }
  .pcts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center; }
  .pcts div { font-size: 11px; color: var(--muted); }
  .pcts b { display: block; font-size: 13px; font-variant-numeric: tabular-nums; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
  .panel h2 { font-size: 15px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 5px 12px; }
  .seg button.on { background: var(--accent); color: #fff; }
  .bars { display: grid; gap: 6px; }
  .bar-row { display: grid; grid-template-columns: 56px 1fr 72px; gap: 8px; align-items: center; font-size: 12px; }
  .bar-track { position: relative; height: 16px; }
  .bar-track::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .bar { position: absolute; top: 2px; height: 12px; border-radius: 3px; }
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; cursor: pointer; user-select: none; }
  th.sorted { color: var(--text); }
  td { font-variant-numeric: tabular-nums; }
  .coin { display: flex; align-items: center; gap: 8px; }
  .coin img { width: 22px; height: 22px; border-radius: 50%; }
  .coin small { color: var(--muted); }
  .pct { display: inline-block; min-width: 72px; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
  .up { color: var(--up); background: var(--up-bg); }
  .down { color: var(--down); background: var(--down-bg); }
  .na { color: var(--muted); }
  .cp-up { color: var(--up); } .cp-down { color: var(--down); }
  footer { color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Crypto 涨幅 Dashboard</h1>
      <div class="sub" id="status">加载中…</div>
    </div>
    <div class="tools">
      <input id="q" placeholder="搜索币种，如 SOL" aria-label="搜索">
      <button id="refresh">刷新</button>
    </div>
  </header>

  <div class="banner" id="banner"></div>
  <div class="cards" id="cards"></div>

  <div class="panel">
    <h2>涨幅对比
      <span class="seg" id="seg">
        <button data-k="d1" class="on">24小时</button>
        <button data-k="d7">7天</button>
        <button data-k="d30">30天</button>
        <button data-k="y1">1年</button>
      </span>
    </h2>
    <div class="bars" id="bars"></div>
  </div>

  <div class="panel">
    <h2>全部币种</h2>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th data-s="rank">#  币种</th>
          <th data-s="price">价格 (USD)</th>
          <th data-s="d1">24小时</th>
          <th data-s="d7">7天</th>
          <th data-s="d30">30天</th>
          <th data-s="y1">1年</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
  <footer>数据来源：CoinGecko 公共 API，每 60 秒自动刷新。点击表头可排序。仅供参考，不构成投资建议。</footer>
</div>

<script>
const COINS = ["bitcoin","ethereum","solana","binancecoin","ripple","cardano","dogecoin","avalanche-2",
  "polkadot","chainlink","tron","litecoin","the-open-network","shiba-inu","cosmos","near","uniswap",
  "sui","aptos","arbitrum","optimism","pepe","polygon-ecosystem-token","internet-computer"];
const HERO = ["bitcoin","ethereum","solana"];
const URL_ = "https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=" + COINS.join(",") +
  "&order=market_cap_desc&per_page=50&page=1&sparkline=false&price_change_percentage=24h,7d,30d,1y";

const state = { data: [], sort: "rank", dir: 1, period: "d1", q: "" };
const $ = id => document.getElementById(id);

function norm(c) {
  return { id: c.id, sym: c.symbol.toUpperCase(), name: c.name, img: c.image, rank: c.market_cap_rank || 9999,
    price: c.current_price,
    d1: c.price_change_percentage_24h_in_currency ?? c.price_change_percentage_24h,
    d7: c.price_change_percentage_7d_in_currency,
    d30: c.price_change_percentage_30d_in_currency,
    y1: c.price_change_percentage_1y_in_currency };
}
const fmtPct = v => v == null ? "—" : (v > 0 ? "+" : "") + v.toFixed(2) + "%";
const cls = v => v == null ? "na" : v >= 0 ? "up" : "down";
const fmtPrice = p => p == null ? "—" : "$" + (p >= 1 ? p.toLocaleString("en-US", { maximumFractionDigits: 2 })
  : p.toPrecision(4));
const pill = v => `<span class="pct ${cls(v)}">${fmtPct(v)}</span>`;

function renderCards() {
  $("cards").innerHTML = HERO.map(id => state.data.find(c => c.id === id)).filter(Boolean).map(c => `
    <div class="card">
      <div class="name"><img src="${c.img}" alt="">${c.name} <small style="color:var(--muted)">${c.sym}</small></div>
      <div class="price">${fmtPrice(c.price)}</div>
      <div class="pcts">
        ${[["24h","d1"],["7d","d7"],["30d","d30"],["1y","y1"]].map(([l,k]) =>
          `<div>${l}<b class="${c[k] == null ? "na" : c[k] >= 0 ? "cp-up" : "cp-down"}">${fmtPct(c[k])}</b></div>`).join("")}
      </div>
    </div>`).join("");
}

function renderBars() {
  const k = state.period;
  const list = state.data.filter(c => c[k] != null).sort((a, b) => b[k] - a[k]);
  const max = Math.max(1, ...list.map(c => Math.abs(c[k])));
  $("bars").innerHTML = list.map(c => {
    const w = Math.abs(c[k]) / max * 50;
    const style = c[k] >= 0 ? `left:50%;width:${w}%;background:var(--up)` : `right:50%;width:${w}%;background:var(--down)`;
    return `<div class="bar-row"><span>${c.sym}</span><div class="bar-track"><div class="bar" style="${style}"></div></div>
      <b class="${c[k] >= 0 ? "cp-up" : "cp-down"}" style="text-align:right">${fmtPct(c[k])}</b></div>`;
  }).join("");
}

function renderTable() {
  const q = state.q.trim().toLowerCase();
  const k = state.sort;
  const rows = state.data.filter(c => !q || c.sym.toLowerCase().includes(q) || c.name.toLowerCase().includes(q))
    .sort((a, b) => {
      const x = a[k] ?? -Infinity, y = b[k] ?? -Infinity;
      return (x - y) * state.dir * (k === "rank" ? 1 : -1);
    });
  $("rows").innerHTML = rows.map(c => `<tr>
    <td><div class="coin"><span style="color:var(--muted);width:24px">${c.rank}</span><img src="${c.img}" alt="">
      <span>${c.name} <small>${c.sym}</small></span></div></td>
    <td>${fmtPrice(c.price)}</td><td>${pill(c.d1)}</td><td>${pill(c.d7)}</td><td>${pill(c.d30)}</td><td>${pill(c.y1)}</td>
  </tr>`).join("") || `<tr><td colspan="6" class="na">没有匹配的币种</td></tr>`;
  document.querySelectorAll("th").forEach(th => th.classList.toggle("sorted", th.dataset.s === k));
}

function renderAll() { renderCards(); renderBars(); renderTable(); }

async function load() {
  $("status").textContent = "更新中…";
  try {
    const r = await fetch(URL_);
    if (!r.ok) throw new Error("HTTP " + r.status);
    state.data = (await r.json()).map(norm);
    $("banner").style.display = "none";
    $("status").textContent = "最后更新：" + new Date().toLocaleString();
    renderAll();
  } catch (e) {
    $("banner").style.display = "block";
    $("banner").textContent = "获取实时数据失败（" + e.message + "）。可能是 API 限流，稍后点击“刷新”重试。";
    $("status").textContent = "更新失败";
  }
}

$("refresh").onclick = load;
$("q").oninput = e => { state.q = e.target.value; renderTable(); };
$("seg").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  state.period = b.dataset.k;
  document.querySelectorAll("#seg button").forEach(x => x.classList.toggle("on", x === b));
  renderBars();
};
document.querySelectorAll("th").forEach(th => th.onclick = () => {
  const s = th.dataset.s;
  if (state.sort === s) state.dir *= -1; else { state.sort = s; state.dir = 1; }
  renderTable();
});
load();
setInterval(load, 60000);
</script>
</body>
</html>
